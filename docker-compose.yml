services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: korean_rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-korean_rental}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl_user} -d ${POSTGRES_DB:-korean_rental}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: korean_rental_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-migrate:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-korean_rental}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'CREATE TABLE IF NOT EXISTS public.schema_migrations (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'
        for migration in /docker-entrypoint-initdb.d/*.sql; do
          filename="$${migration##*/}"
          applied="$$(psql -v ON_ERROR_STOP=1 -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1 FROM public.schema_migrations WHERE filename = '$$filename'")"
          [ "$$applied" = 1 ] && continue
          psql -v ON_ERROR_STOP=1 -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f "$$migration"
          psql -v ON_ERROR_STOP=1 -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "INSERT INTO public.schema_migrations(filename) VALUES ('$$filename')"
        done

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korean_rental_scheduler
    restart: unless-stopped
    init: true
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-korean_rental}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-korean-rental-etl/0.1.0}
      NOMINATIM_RATE_LIMIT_PER_SEC: ${NOMINATIM_RATE_LIMIT_PER_SEC:-1}
      DOWNLOAD_DELAY_SEC: ${DOWNLOAD_DELAY_SEC:-2.0}
      CONCURRENT_REQUESTS: ${CONCURRENT_REQUESTS:-2}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      EXTRACT_CUTOFF_DAYS: ${EXTRACT_CUTOFF_DAYS:-30}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-etl@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TZ: UTC
    volumes:
      - scheduler_state:/var/lib/korean-rental-etl
      - scheduler_logs:/var/log/korean-rental-etl

volumes:
  postgres_data:
  redis_data:
  scheduler_state:
  scheduler_logs:
